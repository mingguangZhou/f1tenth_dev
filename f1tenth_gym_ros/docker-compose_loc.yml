#
# Localization/RoboRacer compose variant.
# Aligned with f1tenth_rocker_loc_start.sh mounts, but without NVIDIA/rocker.
#
# Use from:
#   ~/f1tenth_dev/f1tenth_gym_ros
#
# Start:
#   docker-compose -f docker-compose_loc.yml up
#
# Enter:
#   docker exec -it f1tenth_gym_ros_loc /bin/bash

version: "3"

services:
  sim:
    image: f1tenth_gym_ros_localization_ready:latest
    container_name: f1tenth_gym_ros_loc
    volumes:
      - .:/sim_ws/src/f1tenth_gym_ros
      - ../reactive_control/safety_bubble:/sim_ws/src/safety_bubble
      - ../path_following/boundary_detection:/sim_ws/src/boundary_detection
      - ../path_following/path_following:/sim_ws/src/path_following
      - ../drive_arbitration:/sim_ws/src/drive_arbitration
      - ../slam_toolbox:/sim_ws/src/slam_toolbox
      - ../range_libc:/sim_ws/src/range_libc
      - ../particle_filter:/sim_ws/src/particle_filter
      - ../centerline_tools:/sim_ws/src/centerline_tools
      - ../path_following_v2:/sim_ws/src/path_following_v2
      - ../reactive_control_v2:/sim_ws/src/reactive_control_v2
      - ../rl_training:/sim_ws/src/rl_training
      - ../rl_speed_inference:/sim_ws/src/rl_speed_inference
      - ./install_localization_env.sh:/sim_ws/install_localization_env.sh
    environment:
      - DISPLAY=novnc:0.0
    networks:
      - x11
    working_dir: /sim_ws
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  novnc:
    image: theasp/novnc:latest
    environment:
      - DISPLAY_WIDTH=1728
      - DISPLAY_HEIGHT=972
    ports:
      - "8080:8080"
    networks:
      - x11

networks:
  x11: