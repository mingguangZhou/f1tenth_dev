       -69.978050783807, -51.610917495936, -30.270746123030,
       3.331882473806]
    traffic_start_y:
      [20.858021378203, 24.963264313259, 17.874405971878,
       36.970191962819, 48.664372812587, 53.194754298561,
       44.579662183137, 15.434729380551, -8.723034110816,
       0.266099881040]
