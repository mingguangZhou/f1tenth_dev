       "traffic_5/scan", "traffic_6/scan", "traffic_7/scan", "traffic_8/scan",
       "traffic_9/scan", "traffic_10/scan"]
    traffic_drive_topics:
      ["opp_drive", "traffic_2/drive", "traffic_3/drive", "traffic_4/drive",
       "traffic_5/drive", "traffic_6/drive", "traffic_7/drive", "traffic_8/drive",
       "traffic_9/drive", "traffic_10/drive"]

    # Ten exact, equal arc-length phases around the validated closed route.
