ppo_speed_node:
  ros__parameters:
    use_sim_time: true

    # Set these to the model and raceline used by your training run.
    model_path: "/sim_ws/src/rl_training/models/V0_reward_ppo_speed_spielberg_1000k_20260612.zip"
    centerline_csv: "/sim_ws/src/centerline_tools/centerline_output/raceline_points_smooth.csv"

    odom_topic: "/ego_racecar/odom"
    speed_residual_topic: "/rl_speed_inference/speed_residual_mps"

    # Must match the speed block used by rl_training and path_following_v2.
    # speed_min/speed_max are the final physical command envelope.
    # rule_min/rule_max define the rule baseline envelope.
    # max_delta_speed_mps bounds the model residual before gate scaling.
    speed_min: 1.0
    speed_max: 10.0
    rule_min_speed_mps: 1.0
    rule_max_speed_mps: 6.0
    max_delta_speed_mps: 4.0

    # Must match the curvature block used by rl_training.
    curvature_gain: 2.0
    rule_curvature_lookahead_points: 3
    model_curvature_short_points: 10
    model_curvature_mid_points: 40
    model_curvature_long_points: 80

    # Runtime residual gate, matching F110SpeedEnv gate logic.
    enable_rl_gate: true
    rl_gate_enable_cte: 0.25
    rl_gate_enable_heading: 0.20
    rl_gate_disable_cte: 0.45
    rl_gate_disable_heading: 0.35
    rl_gate_enable_count: 10
    rl_gate_disable_count: 3
    rl_gate_fade_in_step: 0.05
    rl_gate_fade_out_step: 0.10
