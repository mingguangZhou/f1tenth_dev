ppo_speed_node:
  ros__parameters:
    use_sim_time: false

    # ======================================================================
    # Onboard ratio-assist inference config
    # ======================================================================
    # This node publishes only /rl_speed_inference/speed_residual_mps.
    # path_following_v2 still owns final speed composition and safety fallback.

    # Use the ratio model trained in rl_training. Copy the .zip onto the onboard
    # machine and set this absolute path.
    model_path: "/sim_ws/src/rl_training/models/V1_reward_ratio_ppo_speed_spielberg_500k_20260812.zip"

    # Must be the same raceline geometry used by path_following_v2.
    centerline_csv: "/sim_ws/src/centerline_tools/output_backup/V0_reward_ppo_speed_spielberg_1000k_20260612/raceline_points_smooth.csv"

    odom_topic: "/ego_racecar/odom"
    speed_residual_topic: "/rl_speed_inference/speed_residual_mps"

    # ======================================================================
    # Model interface
    # ======================================================================
    # speed_ratio is the new competition-oriented mode:
    #   model output action [-1,1] -> assist_ratio -> residual_mps.
    # physical_mps is only for legacy models.
    residual_output_mode: "speed_ratio"

    # Positive/negative authority learned in highspeed simulation.
    # assist_gain is the onboard safety/faster knob:
    #   0.10 = very cautious first test
    #   0.25 = cautious
    #   0.50 = moderate in sim only before any real use
    positive_assist_ratio: 0.667
    negative_assist_ratio: 0.50
    assist_gain: 0.5

    # Legacy physical_mps field. Not used in speed_ratio mode.
    max_delta_speed_mps: 4.0

    # ======================================================================
    # Reserved/onboard speed profile
    # ======================================================================
    # These values must match the raceline-following rule-speed setup you want
    # the model to assist. Keep them conservative for onboard.
    command_speed_min_mps: 1.0
    command_speed_max_mps: 10.0
    rule_curve_min_speed_mps: 1.0
    rule_straight_speed_mps: 5.0
    rule_speed_curvature_gain: 2.0
    rule_speed_curvature_preview_m: 0.50

    # ======================================================================
    # Model curvature observation previews
    # ======================================================================
    # Must match the ratio-assist rl_training model.
    model_curvature_short_preview_m: 0.30
    model_curvature_mid_preview_m: 1.20
    model_curvature_long_preview_m: 2.40

    # Legacy point-count fallbacks. Not used when the metre previews above are set.
    rule_curvature_lookahead_points: 3
    model_curvature_short_points: 10
    model_curvature_mid_points: 40
    model_curvature_long_points: 80

    # ======================================================================
    # Runtime residual gate
    # ======================================================================
    # Keep enabled for first onboard tests. If tracking is not clearly good, the
    # published residual fades to zero, so path_following_v2 returns to rule speed.
    enable_rl_gate: true
    rl_gate_enable_cte: 0.25
    rl_gate_enable_heading: 0.20
    rl_gate_disable_cte: 0.45
    rl_gate_disable_heading: 0.35
    rl_gate_enable_count: 10
    rl_gate_disable_count: 3
    rl_gate_fade_in_step: 0.05
    rl_gate_fade_out_step: 0.10
