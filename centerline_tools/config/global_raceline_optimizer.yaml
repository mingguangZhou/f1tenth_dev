parameters:
  optimization_spacing_m: 0.15
  output_spacing_m: 0.03
  safety_margin_m: 0.25
  maximum_lateral_offset_m: 1.50
  ray_step_fraction: 0.40
  validation_step_m: 0.005
  curvature_weight: 1.0
  curvature_rate_weight: 0.02
  curvature_limit_weight: 0.10
  comfortable_curvature_inv_m: 0.90
  segment_uniformity_weight: 1.0
  # Balance minimum curvature with distance so turns use an
  # outside-inside-outside line instead of remaining on the outer parallel.
  path_length_weight: 0.125
  offset_weight: 0.001
  # Permit gradual cross-track transitions between corner entry and apex.
  offset_slope_weight: 0.005
  # 0.95 * tan(20.6 deg) / 0.33 m, matching the runtime steering envelope.
  maximum_curvature_inv_m: 1.082
  maximum_iterations_per_stage: 2500
  function_tolerance: 1.0e-9
  gradient_tolerance: 2.0e-4
