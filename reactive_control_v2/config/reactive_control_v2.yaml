upper_corridor_follower:
  ros__parameters:
    use_sim_time: false

    # ROS interfaces
    scan_topic: "/scan"
    odom_topic: "/odom"
    # All paths, control geometry, validation and markers use this frame.
    # LaserScan endpoints are transformed here through the existing static TF.
    base_frame: "base_link"
    transform_timeout_sec: 0.05
    enable_topic: "/reactive_control_v2/enable"
    command_topic: "/reactive_control_v2/nominal_cmd"
    path_topic: "/reactive_control_v2/local_path"
    marker_topic: "/reactive_control_v2/markers"
    status_topic: "/reactive_control_v2/status"
    require_enable_message: false

    # Input handling
    scan_timeout_sec: 0.30
    odom_timeout_sec: 0.50
    require_fresh_odom: false
    planning_angle_min_deg: -75.0
    planning_angle_max_deg: 75.0
    scan_range_cap_m: 6.0
    median_filter_window: 3
    min_valid_beam_ratio: 0.35

    # Vehicle envelope
    vehicle_width_m: 0.28
    lateral_safety_margin_m: 0.10
    obstacle_endpoint_margin_m: 0.02

    # Corridor construction
    forward_start_m: 0.30
    forward_max_m: 6.0
    forward_slice_step_m: 0.20
    lateral_limit_m: 2.0
    lateral_sample_step_m: 0.05
    min_interval_width_m: 0.10
    max_interval_shift_per_slice_m: 0.25
    min_path_reach_m: 0.80

    # Corridor persistence
    reach_tie_tolerance_m: 0.30
    width_tie_tolerance_m: 0.08
    switch_reach_advantage_m: 0.50
    switch_confirmation_cycles: 3
    side_deadband_m: 0.12

    # Local-path smoothing
    spatial_smoothing_passes: 3
    spatial_smoothing_weight: 0.45
    temporal_smoothing_alpha: 0.30
    path_start_anchor_points: 3

    # Validate the complete smoothed/raw path against observed LiDAR free space.
    # Set false only for controlled debugging; PATH_INVALID and its hysteresis
    # are then disabled, so they cannot request lower-layer FTG takeover.
    enable_swept_path_validation: true
    # First failed cycle stops the upper immediately as PATH_VALIDATION_PENDING.
    # PATH_INVALID is published only after this many consecutive failed cycles.
    swept_path_failure_confirmation_cycles: 1
    # Once PATH_INVALID is latched, require this many consecutive valid paths
    # before returning to DRIVING.
    swept_path_recovery_confirmation_cycles: 2

    # Pure pursuit (kept close to the existing path-following controller)
    lookahead_distance_m: 0.60
    wheelbase_m: 0.33
    steering_max_deg: 25.0 # 20.6
    steering_filter_alpha: 0.40

    # Simple nominal speed profile
    velocity_max_mps: 1.65
    velocity_min_mps: 0.95
    slow_reach_distance_m: 1.50
    stop_reach_distance_m: 0.60

    # Debug
    publish_visualization: true
    marker_lifetime_sec: 0.25
    # Limit RViz MarkerArray work to 10 Hz. Set 0.0 to publish every scan.
    visualization_period_sec: 0.10
    # Default: print one concise warning only when entering/changing a stop state.
    # True: also print full driving/path diagnostics immediately on change and
    # periodically according to terminal_status_period_sec.
    full_terminal_debug: false
    terminal_status_period_sec: 2.0


lower_safety_controller:
  ros__parameters:
    use_sim_time: false

    # ROS interfaces. In the standalone simulator launch, selected_cmd is
    # remapped to the upper follower's nominal_cmd and safe_cmd to /drive.
    selected_command_topic: "/reactive_control_v2/selected_cmd"
    scan_topic: "/scan"
    # VESC-derived onboard speed feedback.
    odom_topic: "/odom"
    upper_status_topic: "/reactive_control_v2/status"
    safe_command_topic: "/reactive_control_v2/safe_cmd"
    lower_status_topic: "/reactive_control_v2/lower_safety_status"

    control_frequency_hz: 20.0
    command_timeout_sec: 0.30
    scan_timeout_sec: 0.30
    odom_timeout_sec: 0.50
    upper_status_timeout_sec: 0.50
    # If true, a fresh upper PATH_INVALID or BLOCKED status requests lower FTG.
    # Set false when selected_cmd may come from a different controller. The
    # previous use_upper_status_fallback name has been replaced by this one.
    enable_fallback_on_upper_failure_status: true

    # Final command bounds. Speed remains a loose sanity limit; steering is
    # clamped to the approximate physical limit.
    absolute_speed_limit_mps: 20.0
    # Physical steering is approximately +/-25 degrees.
    absolute_steering_limit_deg: 25.0

    # Simple forward emergency brake only. No commanded-trajectory prediction
    # or scan-versus-steering validation is performed in this lower controller.
    emergency_sector_half_angle_deg: 10.0
    emergency_distance_m: 0.35
    emergency_ttc_sec: 0.2
    emergency_ttc_clearance_m: 0.12

    # Slow Follow-the-Gap fallback, adapted from the supplied safety_bubble
    # reference package and kept deliberately less aggressive than the upper.
    fallback_sector_half_angle_deg: 90.0
    fallback_range_cap_m: 1.0
    fallback_min_valid_ratio: 0.35
    fallback_bubble_radius_m: 0.30
    fallback_min_clearance_m: 0.70
    fallback_min_gap_width_deg: 8.0
    fallback_steering_gain: 1.0
    fallback_steering_limit_deg: 25.0
    fallback_speed_max_mps: 1.10
    fallback_speed_min_mps: 0.95
    # Target the centre of beams at least this fraction of the selected gap's
    # maximum depth. This avoids the old near-zero-angle deepest-beam tie-break.
    fallback_deepest_region_ratio: 0.90

    # Periodic FTG terminal details for tuning. Default off to avoid ROS log
    # growth. When enabled, prints gap, bubble, target, steering and speed.
    fallback_terminal_debug: false
    fallback_terminal_debug_period_sec: 0.50

    # Bidirectional VESC low-speed stall assistance. The demand ceiling only
    # selects eligible commands; output_mps is the independent forced magnitude.
    # Shortfall is max(0, |requested speed| - |measured speed|).
    enable_low_speed_assist: true
    low_speed_assist_demand_max_mps: 1.00
    low_speed_assist_output_mps: 1.00
    low_speed_assist_entry_shortfall_mps: 0.50
    low_speed_assist_stall_speed_mps: 0.30
    low_speed_assist_confirmation_sec: 0.30
    low_speed_assist_exit_shortfall_mps: 0.20

    # Bounded reverse recovery
    # VESC-derived odometry is required for reverse entry, distance estimation,
    # and the complete-stop handoff. Scan motion is not required in this version.
    enable_reverse_recovery: true

    # Entry confirmation
    stationary_speed_threshold_mps: 0.05
    dead_end_confirmation_sec: 1.0
    stuck_forward_command_threshold_mps: 0.20
    stuck_speed_threshold_mps: 0.05
    stuck_confirmation_sec: 1.0

    # Reverse command and bounds. Recovery always commands zero steering.
    reverse_speed_mps: 0.95
    reverse_min_distance_m: 0.10
    reverse_min_duration_sec: 0.30
    reverse_max_distance_m: 0.50
    reverse_max_duration_sec: 2.0
    reverse_max_attempts: 10
    reverse_attempt_reset_forward_time_sec: 0.30
    reverse_attempt_reset_speed_mps: 0.20

    # Reverse exit and forward handoff. This hysteresis is used for reverse
    # recovery only; ordinary upper-to-FTG takeover remains immediate.
    ftg_recovery_valid_cycles: 5
    recovery_settle_time_sec: 0.20

    # A front Hokuyo cannot observe directly behind the car. Available rear-side
    # beams are only an extra abort check; reverse remains a bounded retrace.
    reverse_require_side_clearance: true
    reverse_side_sector_min_angle_deg: 100.0
    reverse_side_sector_max_angle_deg: 135.0
    reverse_min_side_clearance_m: 0.20
    reverse_side_min_valid_ratio: 0.25

    # Rate-limited reverse state details. Default off.
    reverse_terminal_debug: true
    reverse_terminal_debug_period_sec: 0.50
