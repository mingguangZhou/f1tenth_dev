# Reactive Control V2 — simulator parameters
#
# START TUNING HERE
#   Upper motion:      lookahead_distance_m, velocity_min/max_mps,
#                      slow/stop_reach_distance_m
#   Upper envelope:    vehicle_width_m, lateral_safety_margin_m
#   Upper horizon:     scan_range_cap_m, forward_max_m
#   Lower FTG speed:   fallback_speed_min/max_mps
#   Stall assistance: low_speed_assist_*
#   Reverse recovery: reverse_speed_mps, reverse_*distance/duration*
#
# Parameters marked ADVANCED normally should remain unchanged during speed tuning.

upper_corridor_follower:
  ros__parameters:
    use_sim_time: true

    # ========================================================
    # 1. ROS INTERFACES, FRAME AND AUTHORIZATION
    # ========================================================
    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"
    base_frame: "ego_racecar/base_link"
    transform_timeout_sec: 0.05
    enable_topic: "/reactive_control_v2/enable"
    command_topic: "/reactive_control_v2/nominal_cmd"
    path_topic: "/reactive_control_v2/local_path"
    marker_topic: "/reactive_control_v2/markers"
    status_topic: "/reactive_control_v2/status"
    require_enable_message: false

    # ========================================================
    # 2. SENSOR FRESHNESS AND PLANNING FIELD OF VIEW
    # median_filter_window_beams is intentionally beam/count based.
    # ========================================================
    scan_timeout_sec: 0.30
    odom_timeout_sec: 0.50
    require_fresh_odom: false
    planning_angle_min_deg: -75.0
    planning_angle_max_deg: 75.0
    scan_range_cap_m: 6.0
    median_filter_window_beams: 3
    min_valid_beam_ratio: 0.35

    # ========================================================
    # 3. VEHICLE SAFETY ENVELOPE — PRIMARY SAFETY TUNING
    # Effective half-width = vehicle_width / 2 + lateral_safety_margin.
    # Current value: 0.28 / 2 + 0.10 = 0.24 m per side.
    # ========================================================
    vehicle_width_m: 0.28
    lateral_safety_margin_m: 0.10
    obstacle_endpoint_margin_m: 0.02

    # ========================================================
    # 4. CORRIDOR HORIZON AND RESOLUTION
    # ADVANCED: smaller slice/sample steps cost more CPU.
    # ========================================================
    forward_start_m: 0.30
    forward_max_m: 6.0
    forward_slice_step_m: 0.20
    lateral_limit_m: 2.0
    lateral_sample_step_m: 0.05
    min_interval_width_m: 0.10
    max_interval_shift_per_slice_m: 0.25
    min_path_reach_m: 0.80

    # ========================================================
    # 5. CORRIDOR SELECTION PERSISTENCE — ADVANCED
    # ========================================================
    reach_tie_tolerance_m: 0.30
    width_tie_tolerance_m: 0.08
    switch_reach_advantage_m: 0.50
    switch_confirmation_cycles: 3
    side_deadband_m: 0.12

    # ========================================================
    # 6. LOCAL-PATH SMOOTHING — ADVANCED
    # 0.70 m preserves the former three-slice anchor with 0.30 m start and
    # 0.20 m slice spacing, while remaining stable if resolution changes.
    # ========================================================
    spatial_smoothing_passes: 3
    spatial_smoothing_weight: 0.45
    temporal_smoothing_alpha: 0.30
    path_start_anchor_distance_m: 0.70

    # ========================================================
    # 7. PURE PURSUIT AND REACTIVE SPEED — PRIMARY MOTION TUNING
    # ========================================================
    lookahead_distance_m: 0.60
    wheelbase_m: 0.33
    steering_max_deg: 20.6
    steering_filter_alpha: 0.40
    velocity_max_mps: 2.50
    velocity_min_mps: 1.00
    slow_reach_distance_m: 1.50
    stop_reach_distance_m: 0.60

    # ========================================================
    # 8. SWEPT-PATH VALIDATION AND HYSTERESIS
    # ========================================================
    enable_swept_path_validation: true
    swept_path_failure_confirmation_cycles: 1
    swept_path_recovery_confirmation_cycles: 2

    # ========================================================
    # 9. DEBUG AND VISUALIZATION
    # ========================================================
    publish_visualization: true
    marker_lifetime_sec: 0.25
    visualization_period_sec: 0.10
    full_terminal_debug: false
    terminal_status_period_sec: 2.0


lower_safety_controller:
  ros__parameters:
    use_sim_time: true

    # Forward decision flow:
    # authorization/freshness -> emergency stop -> selected command or FTG
    # -> optional low-speed assist -> final emergency/TTC validation.

    # ========================================================
    # 1. ROS INTERFACES AND REACTIVE AUTHORIZATION
    # ========================================================
    selected_command_topic: "/reactive_control_v2/selected_cmd"
    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"
    upper_status_topic: "/reactive_control_v2/status"
    arbitration_mode_topic: "/drive_arbitration_v2/selected_mode"
    safe_command_topic: "/reactive_control_v2/safe_cmd"
    lower_status_topic: "/reactive_control_v2/lower_safety_status"
    control_frequency_hz: 20.0
    command_timeout_sec: 0.30
    scan_timeout_sec: 0.30
    odom_timeout_sec: 0.50
    upper_status_timeout_sec: 0.50
    enable_fallback_on_upper_failure_status: true
    require_arbitration_mode: false
    arbitration_mode_timeout_sec: 0.50

    # ========================================================
    # 2. ABSOLUTE COMMAND SANITY LIMITS
    # ========================================================
    absolute_speed_limit_mps: 20.0
    absolute_steering_limit_deg: 25.0

    # ========================================================
    # 3. FORWARD EMERGENCY STOP / TTC
    # ========================================================
    emergency_sector_half_angle_deg: 15.0
    emergency_distance_m: 0.35
    emergency_ttc_sec: 0.2
    emergency_ttc_clearance_m: 0.12

    # ========================================================
    # 4. LOWER FOLLOW-THE-GAP FALLBACK
    # This speed range belongs only to lower FTG.
    # ========================================================
    fallback_sector_half_angle_deg: 90.0
    fallback_range_cap_m: 1.0
    fallback_min_valid_ratio: 0.35
    fallback_bubble_radius_m: 0.30
    fallback_min_clearance_m: 0.70
    fallback_min_gap_width_deg: 8.0
    fallback_steering_gain: 1.0
    fallback_steering_limit_deg: 25.0
    fallback_speed_max_mps: 1.0
    fallback_speed_min_mps: 0.4
    fallback_deepest_region_ratio: 0.90
    fallback_terminal_debug: false
    fallback_terminal_debug_period_sec: 0.50

    # ========================================================
    # 5. LOW-SPEED STALL ASSISTANCE
    # ========================================================
    enable_low_speed_assist: true
    low_speed_assist_demand_max_mps: 1.00
    low_speed_assist_output_mps: 1.00
    low_speed_assist_entry_shortfall_mps: 0.50
    low_speed_assist_stall_speed_mps: 0.30
    low_speed_assist_confirmation_sec: 0.30
    low_speed_assist_exit_shortfall_mps: 0.20

    # ========================================================
    # 6. REVERSE ENTRY DETECTION
    # ========================================================
    enable_reverse_recovery: true
    stationary_speed_threshold_mps: 0.05
    dead_end_confirmation_sec: 1.0
    stuck_forward_command_threshold_mps: 0.20
    stuck_speed_threshold_mps: 0.05
    stuck_confirmation_sec: 1.0

    # ========================================================
    # 7. REVERSE COMMAND AND BOUNDS
    # ========================================================
    reverse_speed_mps: 0.25
    reverse_min_distance_m: 0.10
    reverse_min_duration_sec: 0.30
    reverse_max_distance_m: 0.50
    reverse_max_duration_sec: 2.0
    reverse_max_attempts: 10
    reverse_attempt_reset_forward_time_sec: 0.30
    reverse_attempt_reset_speed_mps: 0.20

    # ========================================================
    # 8. REVERSE EXIT AND FORWARD HANDOFF
    # ========================================================
    ftg_recovery_valid_cycles: 5
    recovery_settle_time_sec: 0.20

    # ========================================================
    # 9. REVERSE SIDE-CLEARANCE ABORT
    # Simulator scan lacks reliable rear-side coverage, so this simulator-only
    # check stays disabled. The onboard YAML keeps it enabled.
    # ========================================================
    reverse_require_side_clearance: false
    reverse_side_sector_min_angle_deg: 100.0
    reverse_side_sector_max_angle_deg: 135.0
    reverse_min_side_clearance_m: 0.20
    reverse_side_min_valid_ratio: 0.25

    # ========================================================
    # 10. REVERSE DEBUG
    # ========================================================
    reverse_terminal_debug: false
    reverse_terminal_debug_period_sec: 0.50
