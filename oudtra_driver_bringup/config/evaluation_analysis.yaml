# Analysis-only definitions; these do not change vehicle/controller parameters.
max_gt_gap_sec: 0.10
max_pose_age_sec: 0.50
max_status_gap_sec: 0.50
max_increment_gap_sec: 0.20
# Adjacent pose increment bound = discrete correction margin + rate bound * dt.
jump_position_margin_m: 0.50
jump_speed_bound_mps: 10.0
jump_yaw_margin_rad: 0.35
jump_yaw_rate_bound_radps: 6.0
consistency_window_sec: 0.50
analysis_grid_sec: 0.10
consistency_position_threshold_m: 0.30
consistency_yaw_threshold_rad: 0.25
# Centered quadratic velocity fit; physical source timestamps required.
smoothness_window_sec: 0.50
smoothness_min_span_sec: 0.40
smoothness_max_gap_sec: 0.10
steering_min_dt_sec: 0.01
stall_command_mps: 0.50
stall_speed_mps: 0.10
stall_duration_sec: 2.0
