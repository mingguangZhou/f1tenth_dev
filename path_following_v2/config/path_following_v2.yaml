path_generator:
  ros__parameters:
    # use_sim_time: true

    # Frames
    global_frame: "map"
    robot_frame: "base_link"
    tf_timeout_sec: 0.05

    # Input from centerline_tools raceline publisher.
    # Expected Float64MultiArray rows:
    # [index, x, y, yaw, curvature, curvature_abs]
    raceline_waypoints_topic: "/raceline_waypoints"

    # Outputs consumed by path_following_v2.
    local_path_topic: "/path_following_v2/local_path"
    speed_index_topic: "/path_following_v2/speed_index"

    publish_rate_hz: 20.0

    # Local forward window extracted from the global raceline.
    local_path_horizon_points: 80

    # Speed-index publishing mode.
    # "rule_based": path_generator publishes curvature-based /path_following_v2/speed_index.
    # "external": path_generator only publishes local_path; another node, e.g. RL inference, publishes speed_index.
    speed_index_mode: "rule_based"

    # Deterministic baseline speed request.
    # Output is a normalized speed index in [0, 1], not m/s.
    # Follower converts it to speed_min + index * (speed_max - speed_min).
    curvature_speed_gain: 2.0
    curvature_lookahead_points: 10
    min_speed_index: 0.0
    max_speed_index: 1.0

path_following_v2:
  ros__parameters:
    use_sim_time: true

    # Frames
    global_frame: "map"
    robot_frame: "base_link"
    tf_timeout_sec: 0.1

    # Inputs from path_generator.
    local_path_topic: "/path_following_v2/local_path"
    speed_index_topic: "/path_following_v2/speed_index"

    # Output control command.
    drive_topic: "/drive"

    control_rate_hz: 20.0
    path_timeout_sec: 1.0
    speed_index_timeout_sec: 0.5

    # Speed range used to map normalized speed_index to physical speed.
    # speed = speed_min + speed_index * (speed_max - speed_min)
    speed_min: 0.8
    speed_max: 4.0
    fallback_speed_index: 0.0

    # Pure pursuit steering.
    wheelbase: 0.33
    steering_max_deg: 20.6
    min_forward_point_x: 0.05
    stop_if_no_path: true

    # Speed-dependent lookahead.
    # Active when use_speed_dependent_lookahead=true:
    # lookahead = clamp(min_lookahead + lookahead_speed_gain * speed,
    #                   min_lookahead, max_lookahead)
    fixed_lookahead_distance: 0.60
    use_speed_dependent_lookahead: true
    min_lookahead: 0.6
    max_lookahead: 1.6
    lookahead_speed_gain: 0.25

    # Optional RViz debug markers in robot/base frame.
    publish_markers: true
    marker_frame: "base_link"
    lookahead_marker_topic: "/path_following_v2/lookahead_marker"
    steering_marker_topic: "/path_following_v2/steering_marker"
