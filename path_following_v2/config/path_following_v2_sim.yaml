# Path Following V2 — simulator parameters
#
# START TUNING HERE
#   Normal speed:      rule_straight_speed_mps, rule_curve_min_speed_mps,
#                      rule_speed_curvature_gain, rule_speed_curvature_preview_m
#   Absolute limit:    command_speed_min_mps, command_speed_max_mps (defined once)
#   Maneuver limits:   avoidance/recovery/replan_pending_speed_cap_mps
#   Steering response: steering_*_lookahead_m and steering_lookahead_speed_gain
#   Local window:      local_path_target_length_m (primary physical target)

# ============================================================
# SHARED PHYSICAL COMMAND ENVELOPE
# Adjust once; generator encodes with it, planner uses its maximum as the
# ordinary-path cap, and follower decodes/clips with the same values.
# ============================================================
/**:
  ros__parameters:
    command_speed_min_mps: 0.5
    command_speed_max_mps: 10.0

path_generator:
  ros__parameters:
    use_sim_time: true

    # --------------------------------------------------------
    # FRAMES, INTERFACES AND TIMING
    # --------------------------------------------------------
    global_frame: "map"
    robot_frame: "ego_racecar/base_link"
    tf_timeout_sec: 0.05
    raceline_waypoints_topic: "/raceline_waypoints"
    local_path_topic: "/path_following_v2/raceline_local_path"
    rule_speed_index_topic: "/path_following_v2/rule_speed_index"
    status_topic: "/path_following_v2/raceline_path_status"
    publish_rate_hz: 20.0

    # --------------------------------------------------------
    # LOCAL PATH WINDOW
    # Physical length is primary. Point count is only a computation ceiling.
    # Ten metres normally need about 334 points at the current ~0.03 m spacing.
    # The legacy point-count fallback remains internal and is used only if the
    # metric target is set <= 0.
    # --------------------------------------------------------
    local_path_target_length_m: 10.0
    local_path_max_points: 600

    # --------------------------------------------------------
    # RULE-BASED BASELINE SPEED — PRIMARY SPEED TUNING
    # rule_speed = clip(straight_speed / (1 + gain * preview_curvature),
    #                   curve_min_speed, straight_speed)
    # The 0.09 m preview preserves the previous three-waypoint behavior for
    # the current ~0.03 m raceline spacing. Tune it separately if desired.
    # --------------------------------------------------------
    rule_curve_min_speed_mps: 1.0
    rule_straight_speed_mps: 2.5
    rule_speed_curvature_gain: 2.0
    rule_speed_curvature_preview_m: 0.50

local_trajectory_planner:
  ros__parameters:
    use_sim_time: true

    # --------------------------------------------------------
    # INTERFACES, FRAME AND FRESHNESS
    # --------------------------------------------------------
    raw_path_topic: "/path_following_v2/raceline_local_path"
    final_path_topic: "/path_following_v2/local_path"
    scan_topic: "/scan"
    speed_cap_topic: "/path_following_v2/trajectory_speed_cap_mps"
    status_topic: "/path_following_v2/path_status"
    marker_topic: "/path_following_v2/detour_markers"
    robot_frame: "ego_racecar/base_link"
    control_rate_hz: 20.0
    raw_path_timeout_sec: 0.30
    scan_timeout_sec: 0.30
    transform_timeout_sec: 0.05

    # --------------------------------------------------------
    # PLANNING AND SENSOR DISTANCES
    # The actual obstacle trigger is clipped only when a complete detour plus
    # the minimum smooth return would not fit in the available local path.
    # --------------------------------------------------------
    scan_range_cap_m: 10.0
    planning_distance_m: 10.0

    # --------------------------------------------------------
    # VEHICLE ENVELOPE AND OBSTACLE EVIDENCE
    # Effective half-width = vehicle_width / 2 + lateral margin = 0.24 m.
    # blocked_min_points and beam-gap settings are intentionally count based.
    # --------------------------------------------------------
    vehicle_width_m: 0.28
    lateral_safety_margin_m: 0.10
    min_valid_beam_ratio: 0.35
    blocked_min_points: 3
    cluster_max_beam_gap: 2
    cluster_point_gap_m: 0.18
    max_obstacle_size_m: 0.50
    obstacle_size_tolerance_m: 0.15
    critical_obstacle_distance_m: 0.80

    # --------------------------------------------------------
    # DETOUR GEOMETRY AND CURVATURE FEASIBILITY
    # Advanced: candidate count remains discrete to bound computation.
    # --------------------------------------------------------
    detour_longitudinal_buffer_m: 0.20
    detour_extra_clearance_m: 0.0
    detour_return_min_length_m: 1.50
    detour_return_max_length_m: 5.00
    candidate_lateral_step_m: 0.08
    max_candidates_per_side: 6
    max_lateral_shift_m: 0.80
    wheelbase_m: 0.33
    steering_max_deg: 20.6
    curvature_safety_factor: 0.95

    # --------------------------------------------------------
    # TEMPORARY LOCAL-TRAJECTORY SPEED CAPS
    # Ordinary raceline cap = shared command_speed_max_mps.
    # --------------------------------------------------------
    avoidance_speed_cap_mps: 1.5
    recovery_speed_cap_mps: 1.5
    replan_pending_speed_cap_mps: 1.0

    # --------------------------------------------------------
    # RECOVERY AND PERSISTENT-PLAN STATE
    # --------------------------------------------------------
    recovery_enter_lateral_error_m: 0.18
    recovery_exit_lateral_error_m: 0.08
    recovery_exit_heading_error_deg: 10.0
    recovery_min_rejoin_length_m: 2.5
    recovery_max_rejoin_length_m: 5.0
    recovery_length_gain: 3.0
    minimum_plan_hold_sec: 0.50
    maximum_plan_hold_sec: 12.0
    plan_deviation_replan_m: 0.35
    side_switch_clearance_advantage_m: 0.10
    side_commit_obstacle_distance_m: 3.0
    side_commit_lateral_progress_m: 0.08
    precommit_max_sec: 0.75
    precommit_refine_interval_scans: 2
    side_switch_confirmation_evaluations: 2
    rejoin_confirmation_scans: 4
    active_path_blocked_confirmation_scans: 3
    no_safe_path_confirmation_scans: 3
    enable_detour_planning: true
    publish_markers: true

path_following_v2:
  ros__parameters:
    use_sim_time: true

    # --------------------------------------------------------
    # FRAMES, INTERFACES AND FRESHNESS
    # --------------------------------------------------------
    global_frame: "map"
    robot_frame: "ego_racecar/base_link"
    tf_timeout_sec: 0.1
    local_path_topic: "/path_following_v2/local_path"
    rule_speed_index_topic: "/path_following_v2/rule_speed_index"
    rl_speed_residual_topic: "/rl_speed_inference/speed_residual_mps"
    trajectory_speed_cap_topic: "/path_following_v2/trajectory_speed_cap_mps"
    drive_topic: "/path_following_v2/nominal_cmd"
    status_topic: "/path_following_v2/status"
    control_rate_hz: 20.0
    path_timeout_sec: 1.0
    rule_speed_index_timeout_sec: 0.5
    rl_residual_timeout_sec: 0.5
    trajectory_speed_cap_timeout_sec: 0.5

    # --------------------------------------------------------
    # SPEED POLICY AND COMMAND DYNAMICS
    # 0 = rule baseline only; 1 = rule baseline + fresh RL speed residual.
    # A stale residual automatically falls back to the rule baseline.
    # --------------------------------------------------------
    speed_policy_mode: 1
    max_speed_delta_per_step_mps: 0.2
    require_trajectory_speed_cap: true

    # --------------------------------------------------------
    # PURE-PURSUIT STEERING — ALL SPATIAL VALUES ARE METRES
    # active lookahead = clip(min + gain * commanded_speed, min, max)
    # --------------------------------------------------------
    wheelbase_m: 0.33
    steering_max_deg: 20.6
    min_forward_point_x_m: 0.05
    stop_if_no_path: true
    fixed_steering_lookahead_m: 0.60
    use_speed_dependent_steering_lookahead: true
    steering_min_lookahead_m: 0.3
    steering_max_lookahead_m: 1.5
    steering_lookahead_speed_gain: 0.25

    # --------------------------------------------------------
    # DEBUG AND VISUALIZATION
    # --------------------------------------------------------
    publish_markers: true
    marker_frame: "ego_racecar/base_link"
    lookahead_marker_topic: "/path_following_v2/lookahead_marker"
    steering_marker_topic: "/path_following_v2/steering_marker"
